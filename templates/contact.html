<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Information - ChargeFinder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            padding: 40px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .info-section {
            margin: 20px 0;
        }
        .info-title {
            font-weight: bold;
            color: #333;
        }
        .info-detail {
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h1>Contact Information</h1>

        <div class="info-section">
            <div class="info-title"> Address:</div>
            <div class="info-detail">123 Electric Lane, Green City, EV State, 456789</div>
        </div>

        <div class="info-section">
            <div class="info-title"> Phone:</div>
            <div class="info-detail">+91 98765 43210</div>
        </div>

        <div class="info-section">
            <div class="info-title"> Email:</div>
            <div class="info-detail">support@chargefinder.com</div>
        </div>

        <div class="info-section">
            <div class="info-title"> Working Hours:</div>
            <div class="info-detail">Monday to Friday: 9 AM – 6 PM<br>Saturday: 10 AM – 2 PM</div>
        </div>
    </div>
</body>
</html>
