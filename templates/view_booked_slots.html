{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Booked Slots</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 40px;
    }

    .container {
      background: white;
      padding: 30px;
      max-width: 900px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #1e88e5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 16px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #f0f0f0;
      color: #333;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    p {
      text-align: center;
      font-size: 18px;
      color: #777;
    }

    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }

    .delete-btn:hover {
      background-color: #c82333;
    }

    .actions-column {
      width: 100px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>My Booked Slots</h2>

    {% if booked_slots %}
      <table>
        <tr>
          <th>Station</th>
          <th>Date</th>
          <th>Time</th>
          <th>Duration</th>
          <th class="actions-column">Actions</th>
        </tr>
        {% for slot in booked_slots %}
        <tr>
          <td>{{ slot.station_name }}</td>
          <td>{{ slot.date }}</td>
          <td>{{ slot.time }}</td>
          <td>{{ slot.duration }} hrs</td>
          <td class="actions-column">
            <a href="{% url 'delete_booking' slot.id %}" class="delete-btn" onclick="return confirm('Are you sure you want to delete this booking?')">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </table>
    {% else %}
      <p>You have no booked slots.</p>
    {% endif %}
  </div>
</body>
</html>
